# PURPOSE: Default rendering parameters. Sweep configs override individual keys.
# WHAT GOES HERE: Page geometry, font, anti-aliasing, colours, phase, render mode.
# FILLED IN AT STEP: W1.5 (values), W1.6 (page size from the reader, D8).
# DO NOT: Use a page size the reader's processor would resize (D8).

page_width_px: 448                # overwritten per reader by grid.resolve_render_cfg (D8)
page_height_px: 448               # overwritten per reader by grid.resolve_render_cfg (D8)
margin_px: 14                     # one patch; the 500M reader overrides it with 16
font_file: data/external/fonts/source-sans-3/SourceSans3-Regular.ttf
font_size_px: 16                  # until the size ladder in Phase 2 sets one per reader
line_pitch_px: 20                 # floor(1.25 x 16 + 0.5): the unaligned pitch
aa_mode: coverage_srgb            # enum: binary | coverage_srgb | coverage_linear; the baseline proposed in D11, decided at Gate 1
text_color: [0, 0, 0]
background_color: [255, 255, 255]
phase_x_px: 0
phase_y_px: 0
render_mode: conventional         # enum: conventional | patch_aware
patch_aware_slot_px: null         # null means the reader's patch size (D10)
max_phase_x_px: null              # null = the reader's sweep period - 1; section 2.4 narrows it per axis
max_phase_y_px: null              # null = the reader's sweep period - 1; section 2.4 narrows it per axis
