# PURPOSE: Run the non-todo test suite on every push.
# WHAT GOES HERE: CI steps. No GPU, no model downloads.
# FILLED IN AT STEP: Scaffolded at setup.
# DO NOT: Install torch or download models here. Do not run todo tests in CI until implemented.
name: tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package without GPU extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -m "not todo"
